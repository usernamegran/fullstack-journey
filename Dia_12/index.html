<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Academia ELITE</title>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>Academia ELITE</h1>
  </header>

  <!-- Menu -->
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Contato</a>
  </nav>

  <!-- Conteúdo principal -->
  <main>
    <section id="planos">
      <h2>Nossos planos</h2>

      <!-- Conteúdo independente -->
      <article>
        <h3>Plano mensal 5x</h3>
        <p>Treine todos os dias.</p>
      </article>
      <article>
        <h3>Plano mensal 3x</h3>
        <p>Treine tres vezes por semana.</p>
      </article>
    </section>

    <section id="contato">
      <h2>Cadastre-se</h2>

      <form>
        <label for="nome">Seu nome:</label>
        <input id="nome" name="nome" required>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>Academia ELITE - 2026</p>
  </footer>

</body>
</html>
