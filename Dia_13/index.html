<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Academia</title>
  <!-- Dentro do <head> do HTML -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>Academia</h1>
  </header>

  <!-- Menu -->
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Contato</a>
  </nav>

  <!-- Conteúdo principal -->
  <main>
    <section id="planos">
      <h2>Nossos planos</h2>

      <!-- Conteúdo independente -->
      <article class="card" id="plano">
        <h2 id="titulo">Plano mensal 5x</h2>
        <p>Treine todos os dias.</p>
        <input type="text" placeholder="Seu nome">
      </article>
      <article class="card" id="plano">
        <h2 id="titulo">Plano mensal 3x</h2>
        <p>Treine tres vezes por semana.</p>
        <input type="text" placeholder="Seu nome">
      </article>
    </section>

    <section id="contato">
      <h2>Cadastre-se</h2>

      <form>
        <label for="nome">Seu nome:</label>
        <input id="nome" name="nome" required>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>Academia - 2026</p>
  </footer>

</body>
</html>
